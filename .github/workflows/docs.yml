name: Docs

# The counterpart to ci.yml, which ignores `docs/**` and `**/*.md` so the Python
# suite is not re-run for prose. That exclusion is correct and it left a gap: a
# docs-only change ran NO checks at all, so a broken relative link, a stale
# generated table, or a lesson with no published page could only be caught by a
# human noticing. Each of those has reached main at least once.
#
# Deliberately NOT filtered by base branch. A stacked pull request - one opened
# against another feature branch - otherwise reports no checks whatsoever, which
# is the same hole ci.yml closed for release branches.
on:
  push:
    branches: [main, "release/**"]
    paths:
      - "docs/**"
      - "**/*.md"
      # All of a lesson, not only its lesson.json: the pages show code cut from the
      # lesson's source files, so an edit to one of those can make a page wrong.
      - "lessons/**"
      # check_docs.py shells out to the generators, so a change to one of them can
      # break the check without touching anything else in these filters.
      - "tools/**"
      - "e2e/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      # All of a lesson, not only its lesson.json: the pages show code cut from the
      # lesson's source files, so an edit to one of those can make a page wrong.
      - "lessons/**"
      # check_docs.py shells out to the generators, so a change to one of them can
      # break the check without touching anything else in these filters.
      - "tools/**"
      - "e2e/**"
      - ".github/workflows/docs.yml"

concurrency:
  # Distinct from ci.yml's group on purpose: sharing one would let the two
  # workflows cancel each other on the same ref.
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies: check_docs.py is standard library only, so this stays
      # fast and cannot break on a package it does not need.
      - name: Validate documentation
        run: python3 tools/check_docs.py

  # The same pages, as a browser renders them: each code step shows the code its
  # lesson names, under the right language, and every step of every lesson opens.
  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test the published pages
        working-directory: e2e
        run: npm test
