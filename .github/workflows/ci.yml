name: CI

on:
  push:
    branches: [main, "release/**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Release branches are covered too. Without this, a PR into release/x.y.z ran no
  # checks at all, so breakage only surfaced on the final PR into main - which is
  # exactly how an unbounded `mcp>=1.2` reached a release branch unnoticed.
  pull_request:
    branches: [main, "release/**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: nikolareljin/ci-helpers/.github/workflows/python.yml@production
    with:
      python_version: "3.12"
      working_directory: "."
      lint_command: "pip install -e '.[dev]' && ruff check localrag tests tools examples && mypy localrag"
      test_command: "pip install -e '.[dev]' && python -m pytest -q"
      build_command: ""
